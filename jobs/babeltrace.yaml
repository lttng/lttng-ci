---

- defaults: &babeltrace-defaults
    name: babeltrace
    description: |
      The Babeltrace project provides trace read and write libraries, as well
      as a trace converter. Plugins can be created for any trace format to
      allow its conversion to/from another trace format.

      The main format expected to be converted to/from is the Common Trace
      Format (CTF). The default input format of the "babeltrace" command is
      CTF, and its default output format is a human-readable text log. The
      "babeltrace-log" command converts from a text log to a CTF trace.

      <p>Job is managed by Jenkins Job Builder.</p>

    project-type: freestyle

    wrappers:
      - ansicolor: &babeltrace_wrapper_ansicolor_defaults
          colormap: xterm
      - timeout: &babeltrace_wrapper_timeout_defaults
          timeout: 20
          fail: true
          type: no-activity
          write-description: "<h1 style=\"color:red\">This build failed due to timeout.</h1>"
      - timestamps
      - workspace-cleanup

    scm:
      - git: &babeltrace_scm_git_default
          url: https://github.com/{github_user}/{github_name}.git
          browser: githubweb
          browser-url: https://github.com/{github_user}/{github_name}
          branches:
            - origin/{version}
          basedir: src/babeltrace
          skip-tag: true
          git-tool: '{git_tool}'

    triggers:
      - pollscm:
          cron: "@hourly"
      - timed: "@monthly"

    properties:
      - inject:
          properties-content: |
            PROJECT_NAME=babeltrace
            PYTHON={python}
            TEST_REPORT_TYPE={test_report_type}
            WITH_VENDOR_PYTEST={vendor_pytest}
      - build-discarder:
          !include: common/default_discarder.yaml.inc
      - github:
          url: https://github.com/{github_user}/{github_name}

    # Job variables
    collect_core_dumps: true
    filter: ''
    python: ''
    touchstone: ''
    test_report_type: tap
    vendor_pytest: 'auto'

- defaults:
    <<: *babeltrace-defaults
    name: babeltrace-review
    concurrent: true
    parameters:
      - string:
          name: 'GERRIT_BRANCH'
          default: 'master'
      - string:
          name: 'GERRIT_REFSPEC'
          default: ''
          description: |
            The refspec to fetch. E.g. `refs/changes/15/14715/2`.
            You may find it in the gerrit interface for downloading a specific revision of patch
      - string:
          name: 'GERRIT_NAME'
          default: 'review.lttng.org'
      - string:
          name: 'GERRIT_HOST'
          default: 'review.lttng.org'
      - string:
          name: 'GERRIT_PATCHSET_REVISION'
          default: ''
      - string:
          name: 'GERRIT_PROJECT'
          default: 'babeltrace'
    scm:
      - git:
          <<: *babeltrace_scm_git_default
          shallow-clone: true
          do-not-fetch-tags: true
          git-tool: '{git_tool}'
    triggers:
      - gerrit: &babeltrace_trigger_gerrit_defaults
          trigger-on:
            - comment-added-event:
                approval-category: 'CI-Build'
                approval-value: 1
          projects:
            - project-compare-type: 'PLAIN'
              project-pattern: 'babeltrace'
              branches:
                - branch-compare-type: 'PLAIN'
                  branch-pattern: '{version}'
    # Job variables
    gerrit: true

## Anchors
- job-template: &babeltrace_matrix_axes_defaults
    name: 'babeltrace_matrix_axes_defaults'
    project-type: matrix
    node: 'master'  # Applies only to matrix flyweight task
    execution-strategy:
      combination-filter: '{filter}'
      touchstone:
        expr: '{touchstone}'
        result: unstable
    axes:
      - axis: &babeltrace_matrix_axis_platform
          type: slave
          name: platform
          values: '{obj:platforms}'
      - axis: &babeltrace_matrix_axis_conf
          type: user-defined
          name: conf
          values: '{obj:confs}'
      - axis: &babeltrace_matrix_axis_build
          type: user-defined
          name: build
          values: '{obj:builds}'

- job-template: &babeltrace_matrix_axes_cc
    name: 'babeltrace_matrix_axes_cc'

    <<: *babeltrace_matrix_axes_defaults

    axes:
      - axis: *babeltrace_matrix_axis_platform
      - axis: *babeltrace_matrix_axis_conf
      - axis: *babeltrace_matrix_axis_build
      - axis: &babeltrace_matrix_axis_cc
          type: user-defined
          name: cc
          values: '{obj:ccs}'

- job-template: &babeltrace_builders_defaults
    name: 'babeltrace_builders_defaults'
    builders:
      !j2-yaml: |
      {% if buildtype is defined and buildtype == 'winbuild' %}
      - conditional-step:
          condition-kind: strings-match
          on-evaluation-failure: run
          condition-string1: {{ '${{platform}}' }}
          condition-string2: 'cygwin64'
          steps:
            - shell:
               !include-raw-verbatim:
                 - scripts/common/cygwin64-shebang
                 - scripts/common/cygpath-prefix
                 - lib/resources/clean_coredumps.sh
      {% if gerrit|default(false) %}
                 - scripts/common/gerrit-fetch.sh
      {% endif %}
                 - scripts/common/print.sh
                 - scripts/babeltrace/build.sh
      - conditional-step:
          condition-kind: strings-match
          on-evaluation-failure: run
          condition-string1: {{ '${{platform}}' }}
          condition-string2: 'msys2-ucrt64'
          steps:
            - inject:
               properties-content: 'MSYSTEM=UCRT64'
            - shell:
               !include-raw-verbatim:
                 - scripts/common/msys2-shebang
                 - scripts/common/cygpath-prefix
                 - lib/resources/clean_coredumps.sh
      {% if gerrit|default(false) %}
                 - scripts/common/gerrit-fetch.sh
      {% endif %}
                 - scripts/common/print.sh
                 - scripts/babeltrace/build.sh
      {% else %}
      - shell:
         !include-raw-verbatim:
      {% if buildtype is defined and buildtype == 'macosbuild' %}
           - scripts/common/macos-shebang.sh
      {% endif %}
           - lib/resources/clean_coredumps.sh
      {% if gerrit|default(false) %}
           - scripts/common/gerrit-fetch.sh
      {% endif %}
           - scripts/common/print.sh
           - scripts/babeltrace/build.sh
      {% endif %}

# Use - in version number since yaml anchor do not support dot
- job-template: &babeltrace_builders_glib
    name: 'babeltrace_builders_glib'
    builders:
      - inject:
          properties-content: |
            LD_LIBRARY_PATH=$WORKSPACE/glib-{glib_version}/BUILD_RESULT/lib
            PKG_CONFIG_PATH=$WORKSPACE/glib-{glib_version}/BUILD_RESULT/lib/pkgconfig
            platform=deb13-amd64
            conf=std
            build=std
            PYTHON={python}
            WITH_VENDOR_PYTEST={vendor_pytest}
      - shell: |
          GLIB_VERSION='{glib_version}'
          GLIB_MAJOR_MINOR="$(echo "$GLIB_VERSION" | cut -d '.' -f 1,2)"
          COMPRESSION_FORMAT="xz"
          TAR_ARG="-xf"
          GLIB_CONF_ARGS="--with-pcre=internal --disable-installed-tests --disable-maintainer-mode"
          export CFLAGS='-Wno-error'

          if [ "$GLIB_MAJOR_MINOR" = "2.56" ]; then
            virtualenv "$WORKSPACE/src/glib-venv"
            . "$WORKSPACE/src/glib-venv/bin/activate"
            # 2.56 doesn't work with Python 3.12+ (which removed the imp module)
            pip3 install zombie-imp
            # distutils is required
            pip3 install setuptools
          fi

          if [ "$GLIB_MAJOR_MINOR" = '2.28' ]; then
            COMPRESSION_FORMAT="gz"
            TAR_ARG="-xzf"
            GLIB_CONF_ARGS=""
          fi

          curl -OL "https://download.gnome.org/sources/glib/$GLIB_MAJOR_MINOR/glib-$GLIB_VERSION.tar.$COMPRESSION_FORMAT"
          tar "$TAR_ARG" "glib-$GLIB_VERSION.tar.$COMPRESSION_FORMAT"
          cd "glib-$GLIB_VERSION"
          if [ "$GLIB_VERSION" = '2.28.6' ]; then
            sed -i 's/sys\/types\.h/sys\/sysmacros\.h/' gio/gdbusmessage.c # Fix build failure with recent glibc
          fi

          mkdir BUILD_RESULT
          echo '### Configure glib ###'
          ./configure --prefix="$WORKSPACE/glib-$GLIB_VERSION/BUILD_RESULT" $GLIB_CONF_ARGS
          echo '### Build glib ###'
          make -j$(nproc)
          echo '### Install glib ###'
          make install
      - shell:
          !include-raw-verbatim:
          - lib/resources/clean_coredumps.sh
          - scripts/common/print.sh
          - scripts/babeltrace/build.sh

- _anchors:
    - tap: &babeltrace_publisher_tap_defaults
        results: 'tap/**/*.log'
        fail-if-no-results: true
        failed-tests-mark-build-as-failure: true
        include-comment-diagnostics: true
        output-tap-to-console: false
        todo-is-failure: false
    - junit: &babeltrace_publisher_junit_defaults
        results: 'results.xml'
        keep-long-stdio: true

- job-template: &babeltrace_publishers_defaults
    name: 'babeltrace_publishers_defaults'
    publishers:
      - !j2-yaml: |
        {% if collect_core_dumps|default(true) %}
        postbuildscript:
          mark-unstable-if-failed: true
          builders:
            - role: SLAVE
              build-steps:
                - shell:
                    !include-raw-verbatim:
                    {% if buildtype is defined and buildtype == 'macosbuild' %}
                    - scripts/common/macos-shebang.sh
                    {% endif %}
                    - lib/resources/collect_coredumps.sh
        {% else %}
        postbuildscript:
          builders:
            - role: SLAVE
              build-steps:
                - conditional-step:
                    condition-kind: never
                    on-evaluation-failure: dont-run
                    steps:
                      - shell: |
                          echo "Skipping core dump collection"
        {% endif %}
      - !j2-yaml: |
        {% if test_report_type == "tap" %}
        tap: *babeltrace_publisher_tap_defaults
        {% else %}
        junit: *babeltrace_publisher_junit_defaults
        {% endif %}
      - raw: &babeltrace_publisher_warnings-ng_defaults
          xml: |
            <io.jenkins.plugins.analysis.core.steps.IssuesRecorder plugin="warnings-ng">
              <analysisTools>
                <io.jenkins.plugins.analysis.warnings.Gcc4>
                  <id/>
                  <name/>
                  <jenkins plugin="plugin-util-api"/>
                  <pattern/>
                  <reportEncoding/>
                  <skipSymbolicLinks>false</skipSymbolicLinks>
                </io.jenkins.plugins.analysis.warnings.Gcc4>
              </analysisTools>
              <sourceCodeEncoding/>
              <sourceDirectory/>
              <sourceDirectories/>
              <ignoreQualityGate>false</ignoreQualityGate>
              <ignoreFailedBuilds>true</ignoreFailedBuilds>
              <failOnError>false</failOnError>
              <healthy>0</healthy>
              <unhealthy>0</unhealthy>
              <minimumSeverity plugin="analysis-model-api">
                <name>LOW</name>
              </minimumSeverity>
              <filters/>
              <isEnabledForFailure>true</isEnabledForFailure>
              <isAggregatingResults>true</isAggregatingResults>
              <isBlameDisabled>false</isBlameDisabled>
              <skipPublishingChecks>true</skipPublishingChecks>
              <publishAllIssues>false</publishAllIssues>
              <qualityGates>
                <io.jenkins.plugins.analysis.core.util.QualityGate>
                  <threshold>1</threshold>
                  <type>TOTAL</type>
                  <status>WARNING</status>
                </io.jenkins.plugins.analysis.core.util.QualityGate>
              </qualityGates>
              <trendChartType>AGGREGATION_TOOLS</trendChartType>
              <scm/>
            </io.jenkins.plugins.analysis.core.steps.IssuesRecorder>
      - archive: &babeltrace_publisher_archive_defaults
          artifacts: 'build/**,tap/**,log/**,results.xml,core.tar.xz,src.tar.xz'
          follow-symlinks: true
          allow-empty: false
      - workspace-cleanup: &babeltrace_publisher_workspace-cleanup_defaults
          clean-if:
            - failure: false
      - ircbot: &babeltrace_publisher_ircbot_defaults
          strategy: statechange-only
          message-type: summary
          matrix-notifier: only-parent
      - email-ext: &babeltrace_publisher_email-ext_defaults
          recipients: '{obj:email_to}'
          reply-to: ci-notification@lists.lttng.org
          always: false
          unstable: false
          first-failure: true
          first-unstable: true
          not-built: false
          aborted: false
          regression: false
          failure: false
          second-failure: false
          improvement: false
          still-failing: false
          success: false
          fixed: false
          fixed-unhealthy: true
          still-unstable: false
          pre-build: false
          matrix-trigger: only-parent
          send-to:
            - recipients

- job-template: &babeltrace_publishers_review
    name: 'babeltrace_publishers_review'
    publishers:
      - !j2-yaml: |
        {% if collect_core_dumps|default(true) %}
        postbuildscript:
          mark-unstable-if-failed: true
          builders:
            - role: SLAVE
              build-steps:
                - shell:
                    !include-raw-verbatim:
                    {% if buildtype is defined and buildtype == 'macosbuild' %}
                    - scripts/common/macos-shebang.sh
                    {% endif %}
                    - lib/resources/collect_coredumps.sh
        {% else %}
        postbuildscript:
          builders:
            - role: SLAVE
              build-steps:
                - conditional-step:
                    condition-kind: never
                    on-evaluation-failure: dont-run
                    steps:
                      - shell: |
                          echo "Skipping core dump collection"
        {% endif %}
      - !j2-yaml: |
        {% if test_report_type == "tap" %}
        tap: *babeltrace_publisher_tap_defaults
        {% else %}
        junit: *babeltrace_publisher_junit_defaults
        {% endif %}
      # Fail job on any compiler warnings
      - raw:
          xml: |
            <io.jenkins.plugins.analysis.core.steps.IssuesRecorder plugin="warnings-ng">
              <analysisTools>
                <io.jenkins.plugins.analysis.warnings.Gcc4>
                  <id/>
                  <name/>
                  <jenkins plugin="plugin-util-api"/>
                  <pattern/>
                  <reportEncoding/>
                  <skipSymbolicLinks>false</skipSymbolicLinks>
                </io.jenkins.plugins.analysis.warnings.Gcc4>
              </analysisTools>
              <sourceCodeEncoding/>
              <sourceDirectory/>
              <sourceDirectories/>
              <ignoreQualityGate>false</ignoreQualityGate>
              <ignoreFailedBuilds>true</ignoreFailedBuilds>
              <failOnError>false</failOnError>
              <healthy>0</healthy>
              <unhealthy>0</unhealthy>
              <minimumSeverity plugin="analysis-model-api">
                <name>LOW</name>
              </minimumSeverity>
              <filters/>
              <isEnabledForFailure>true</isEnabledForFailure>
              <isAggregatingResults>true</isAggregatingResults>
              <isBlameDisabled>false</isBlameDisabled>
              <skipPublishingChecks>true</skipPublishingChecks>
              <publishAllIssues>false</publishAllIssues>
              <qualityGates>
                <io.jenkins.plugins.analysis.core.util.QualityGate>
                  <threshold>1</threshold>
                  <type>TOTAL</type>
                  <status>{warnings_status}</status>
                </io.jenkins.plugins.analysis.core.util.QualityGate>
              </qualityGates>
              <trendChartType>AGGREGATION_TOOLS</trendChartType>
              <scm/>
            </io.jenkins.plugins.analysis.core.steps.IssuesRecorder>
      - archive: *babeltrace_publisher_archive_defaults
      - workspace-cleanup: *babeltrace_publisher_workspace-cleanup_defaults


## Job Templates

- job-template:
    name: '{job_prefix}babeltrace_{version}_{buildtype}'
    defaults: babeltrace

    <<: *babeltrace_matrix_axes_defaults
    <<: *babeltrace_builders_defaults
    <<: *babeltrace_publishers_defaults

- job-template:
    name: babeltrace_{version}_{cctype}
    defaults: babeltrace

    <<: *babeltrace_matrix_axes_cc
    <<: *babeltrace_builders_defaults
    <<: *babeltrace_publishers_defaults

- job-template:
    name: 'dev_review_babeltrace_{version}_{buildtype}'
    defaults: babeltrace-review
    properties:
      - inject:
          properties-content: |
            PROJECT_NAME=babeltrace
            BABELTRACE_GIT_UNTRACKED=yes
            PYTHON={python}
            TEST_REPORT_TYPE={test_report_type}
            WITH_VENDOR_PYTEST={vendor_pytest}
      - build-discarder:
          !include: common/review_discarder.yaml.inc
      - throttle:
          option: 'category'
          categories:
            - 'gerrit-{buildtype}'

    <<: *babeltrace_matrix_axes_defaults
    <<: *babeltrace_builders_defaults
    <<: *babeltrace_publishers_review

- job-template:
    name: 'dev_review_babeltrace_{version}_lint'
    defaults: babeltrace-review
    node: 'deb13-amd64'

    builders:
      - shell:
          !include-raw-verbatim:
          - scripts/common/gerrit-fetch.sh
      - shell:
          !include-raw-verbatim:
          - scripts/common/print.sh
          - scripts/babeltrace/lint.sh

    properties:
      - inject:
          properties-content: |
            PROJECT_NAME=babeltrace
            PYTHON={python}
            TEST_REPORT_TYPE={test_report_type}
            WITH_VENDOR_PYTEST={vendor_pytest}
      - build-discarder:
          !include: common/review_discarder.yaml.inc

    publishers:
      - archive:
          artifacts: 'pre-commit.out,black.out,flake8.out,isort.out,clang-format.out,shellcheck.out,check-include-guards.out'
          allow-empty: false
      - workspace-cleanup: *babeltrace_publisher_workspace-cleanup_defaults

- job-template:
    name: 'dev_review_babeltrace_{version}_smokebuild'
    defaults: babeltrace-review

    triggers:
      - gerrit: &babeltrace_trigger_gerrit_smoke
          trigger-on:
            - comment-added-event:
                approval-category: 'Smoke-Build-Lvl1'
                approval-value: 1
          projects:
            - project-compare-type: 'PLAIN'
              project-pattern: 'babeltrace'
              branches:
                - branch-compare-type: 'PLAIN'
                  branch-pattern: '{version}'
          skip-vote:
            successful: true
            failed: true
            unstable: true
            notbuilt: true
            aborted: true

    properties:
      - inject:
          properties-content: |
            PROJECT_NAME=babeltrace
            BABELTRACE_RUN_TESTS=no
            BABELTRACE_GIT_UNTRACKED=yes
            PYTHON={python}
            TEST_REPORT_TYPE={test_report_type}
            WITH_VENDOR_PYTEST={vendor_pytest}
      - build-discarder:
          !include: common/review_discarder.yaml.inc

    <<: *babeltrace_matrix_axes_defaults
    <<: *babeltrace_builders_defaults

    publishers:
      - workspace-cleanup: *babeltrace_publisher_workspace-cleanup_defaults

- job-template:
    name: 'dev_review_babeltrace_{version}_check-format'
    defaults: babeltrace-review

    triggers:
      - gerrit: *babeltrace_trigger_gerrit_smoke

    node: 'deb13-amd64'

    builders:
      - shell:
          !include-raw-verbatim: scripts/common/gerrit-fetch.sh
      - shell:
          !include-raw-verbatim: scripts/common/check-format.sh

    properties:
      - inject:
          properties-content: |
            PROJECT_NAME=babeltrace
            PYTHON={python}
            TEST_REPORT_TYPE={test_report_type}
            WITH_VENDOR_PYTEST={vendor_pytest}
      - build-discarder:
          !include: common/review_discarder.yaml.inc

    publishers:
      - archive:
          artifacts: 'clang-format-fixes.diff'
          allow-empty: true
      - workspace-cleanup: *babeltrace_publisher_workspace-cleanup_defaults

- job-template:
    name: babeltrace_{version}_release
    defaults: babeltrace
    node: 'deb13-amd64'

    triggers:
      - pollscm:
          cron: "@daily"

    scm:
      - git:
          <<: *babeltrace_scm_git_default
          refspec: '+refs/tags/*:refs/remotes/origin/tags/*'
          branches:
            - '*/tags/{version}.*'

    builders:
      - shell:
          !include-raw-verbatim: scripts/babeltrace/release.sh

    publishers:
      - tap: *babeltrace_publisher_tap_defaults
      - raw: *babeltrace_publisher_warnings-ng_defaults
      - workspace-cleanup: *babeltrace_publisher_workspace-cleanup_defaults
      - archive:
          artifacts: 'out/**,tap/**,results.xml,core.tar.xz,src.tar.xz'
          allow-empty: false
          fingerprint: true
      - ircbot: *babeltrace_publisher_ircbot_defaults

- job-template:
    name: babeltrace_{version}_scan-build
    defaults: babeltrace
    node: 'deb13-amd64'

    triggers:
      - pollscm:
          cron: "@daily"

    builders:
      - shell:
          !include-raw-verbatim: scripts/common/scan-build.sh

    publishers:
      - workspace-cleanup: *babeltrace_publisher_workspace-cleanup_defaults
      - html-publisher:
          name: 'HTML Report'
          dir: 'scan-build-archive/'
          files: 'index.html'
      - ircbot: *babeltrace_publisher_ircbot_defaults

- job-template:
    name: babeltrace_{version}_coverity
    defaults: babeltrace
    node: 'deb13-amd64'

    triggers:
      - pollscm:
          cron: "@daily"

    wrappers:
      - ansicolor: *babeltrace_wrapper_ansicolor_defaults
      - timeout: *babeltrace_wrapper_timeout_defaults
      - timestamps
      - workspace-cleanup
      - credentials-binding:
          - username-password-separated:
              credential-id: babeltrace_coverity_token
              username: COVERITY_SCAN_PROJECT_NAME
              password: COVERITY_SCAN_TOKEN

    builders:
      - shell:
          !include-raw-verbatim: scripts/common/coverity.sh

    publishers:
      - workspace-cleanup: *babeltrace_publisher_workspace-cleanup_defaults
      - archive:
          artifacts: 'analysis-results.tgz,cov-int/**'
          allow-empty: false
      - ircbot: *babeltrace_publisher_ircbot_defaults

- job-template:
    name: babeltrace_{version}_lint
    defaults: babeltrace
    node: 'deb13-amd64'

    triggers:
      - pollscm:
          cron: "@daily"

    builders:
      - shell:
          !include-raw-verbatim:
          - scripts/common/print.sh
          - scripts/babeltrace/lint.sh

    publishers:
      - workspace-cleanup: *babeltrace_publisher_workspace-cleanup_defaults
      - archive:
          artifacts: 'pre-commit.out,black.out,flake8.out,isort.out,clang-format.out,shellcheck.out,check-include-guards.out'
          allow-empty: false
      - ircbot: *babeltrace_publisher_ircbot_defaults
      - email-ext: *babeltrace_publisher_email-ext_defaults

- job-template:
    name: '{job_prefix}babeltrace_{version}_glib-{glib_version}'
    defaults: babeltrace
    node: 'deb13-amd64'
    glib_version: '2.56.0'

    <<: *babeltrace_builders_glib
    <<: *babeltrace_publishers_defaults


## Views
- view-template:
    name: 'Babeltrace'
    view-type: categorized
    regex: 'babeltrace[-_].*'
    categorization_criteria:
      - group_regex: '.*_master_.*'
        naming_rule: 'Master'
      - group_regex: '.*_stable-2.1_.*'
        naming_rule: 'Stable 2.1'
      - group_regex: '.*_stable-2.0_.*'
        naming_rule: 'Stable 2.0'


## Projects
- project:
    name: babeltrace2
    job_prefix: ''
    github_user: efficios
    github_name: babeltrace
    git_tool: Default
    email_to: 'ci-notification@lists.lttng.org, cc:jgalar@efficios.com'
    version:
      - stable-2.0
      - stable-2.1
      - master:
          test_report_type: junit
    jobs:
      - '{job_prefix}babeltrace_{version}_{buildtype}':
          buildtype: linuxbuild
          platforms: !!python/tuple [deb13-amd64]
          builds: !!python/tuple [std, oot, dist, oot-dist]
          confs: !!python/tuple [std, static, prod, min, doc, asan]
          filter: '(build=="std") || (conf=="std") || (conf=="doc")'
          touchstone: '(build == "std") && (conf == "std")'
      - '{job_prefix}babeltrace_{version}_{buildtype}':
          buildtype: portbuild
          platforms: !!python/tuple [deb13-ppc64el, deb13-riscv64, deb13-s390x, deb13-i386, deb13-armhf, deb13-arm64]
          builds: !!python/tuple [std]
          confs: !!python/tuple [std, prod]
          touchstone: '(build == "std") && (conf == "std") && (platform == "deb13-i386")'
      - '{job_prefix}babeltrace_{version}_{buildtype}':
          buildtype: slesbuild
          platforms: !!python/tuple [sles16sp0-amd64]
          builds: !!python/tuple [std]
          confs: !!python/tuple [std, prod]
          filter: ''
          touchstone: ''
          version:
            - stable-2.0
            - stable-2.1
            - master:
                test_report_type: junit
      - '{job_prefix}babeltrace_{version}_{buildtype}':
          buildtype: elbuild
